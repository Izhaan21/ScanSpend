<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Inter:wght@500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "background": "#f7f9fb",
                        "outline": "#76777d",
                        "surface-dim": "#d8dadc",
                        "on-tertiary-fixed": "#271901",
                        "on-primary-container": "#7c839b",
                        "on-background": "#191c1e",
                        "secondary-fixed": "#89f5e7",
                        "primary": "#000000",
                        "surface-tint": "#565e74",
                        "on-tertiary-container": "#98805d",
                        "secondary": "#006a61",
                        "surface-container-high": "#e6e8ea",
                        "surface": "#f7f9fb",
                        "on-secondary-container": "#006f66",
                        "surface-container-highest": "#e0e3e5",
                        "on-primary-fixed": "#131b2e",
                        "on-error-container": "#93000a",
                        "on-primary-fixed-variant": "#3f465c",
                        "outline-variant": "#c6c6cd",
                        "on-error": "#ffffff",
                        "on-primary": "#ffffff",
                        "on-secondary-fixed": "#00201d",
                        "inverse-surface": "#2d3133",
                        "on-secondary-fixed-variant": "#005049",
                        "surface-variant": "#e0e3e5",
                        "secondary-container": "#86f2e4",
                        "tertiary-container": "#271901",
                        "on-surface-variant": "#45464d",
                        "primary-fixed": "#dae2fd",
                        "surface-container": "#eceef0",
                        "on-secondary": "#ffffff",
                        "inverse-primary": "#bec6e0",
                        "on-surface": "#191c1e",
                        "error-container": "#ffdad6",
                        "on-tertiary-fixed-variant": "#574425",
                        "error": "#ba1a1a",
                        "primary-fixed-dim": "#bec6e0",
                        "inverse-on-surface": "#eff1f3",
                        "primary-container": "#131b2e",
                        "tertiary": "#000000",
                        "surface-container-low": "#f2f4f6",
                        "surface-bright": "#f7f9fb",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "secondary-fixed-dim": "#6bd8cb",
                        "tertiary-fixed": "#fcdeb5",
                        "tertiary-fixed-dim": "#dec29a"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "xl": "32px",
                        "grid_columns": "12",
                        "base": "4px",
                        "sm": "8px",
                        "gutter": "16px",
                        "xs": "4px",
                        "lg": "24px",
                        "md": "16px",
                        "margin": "24px"
                    },
                    "fontFamily": {
                        "display-lg": ["Manrope"],
                        "label-md": ["Manrope"],
                        "body-md": ["Manrope"],
                        "headline-lg": ["Manrope"],
                        "data-mono": ["Inter"],
                        "body-lg": ["Manrope"],
                        "headline-md": ["Manrope"]
                    },
                    "fontSize": {
                        "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "800"}],
                        "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                        "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                        "data-mono": ["16px", {"lineHeight": "24px", "fontWeight": "500"}],
                        "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                        "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #f7f9fb;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen pb-32">
<!-- TopAppBar -->
<header class="bg-slate-50/90 dark:bg-slate-950/90 docked full-width top-0 sticky z-50 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 shadow-sm">
<div class="flex justify-between items-center w-full px-4 h-16">
<div class="flex items-center gap-3">
<button class="p-2 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors rounded-full active:scale-[0.98] transition-transform duration-200">
<span class="material-symbols-outlined text-slate-900 dark:text-slate-50">arrow_back</span>
</button>
<h1 class="font-['Manrope'] font-bold text-lg tracking-tight text-slate-900 dark:text-slate-50">ScanSpend</h1>
</div>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-slate-500 dark:text-slate-400 p-2">more_vert</span>
</div>
</div>
</header>
<main class="max-w-xl mx-auto px-margin pt-lg space-y-lg">
<!-- Receipt Preview Card -->
<section class="bg-surface-container-lowest border border-outline-variant rounded-xl overflow-hidden shadow-[0_4px_20px_rgba(15,23,42,0.05)] transition-all">
<div class="relative h-48 w-full bg-surface-container">
<img alt="Receipt Scan" class="w-full h-full object-cover opacity-50 grayscale" data-alt="close-up of a paper receipt on a white table with sharp focus on printed text and soft edges" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBEW-8xv5xDatZlXiPXVy5wsUsR9qRUei-kJgmBgFlem7T5ZhyyxiT5WPFp74XoJ3D3ArmDsmdWnor5W-UKI7bHHKaW6bL4ml0JJF1L65hmer_stHJgmkgD-414yJQcjcsc24D5jlCdHU0Ci1ZCiOqUGQUR1TNQZtEzp3rvHHtEXHOlP5Q5YAdHpPUjOM-0GqMQ0kxdX_uWTVWw5cvYIwfsCQfrITIDBTi03GEbmj0PutmCjJGl05SaHy3J1F-zRwM7GYB8R1m5h3Bv"/>
<div class="absolute inset-0 flex items-center justify-center">
<div class="bg-white/90 px-4 py-2 rounded-full border border-teal-600/20 shadow-lg backdrop-blur-sm flex items-center gap-2">
<span class="material-symbols-outlined text-secondary" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="font-label-md text-on-surface">Data Extracted Successfully</span>
</div>
</div>
</div>
</section>
<!-- Category & Meta -->
<section class="space-y-md">
<label class="font-label-md text-on-surface-variant block">Expense Category</label>
<div class="flex flex-wrap gap-sm">
<button class="flex items-center gap-2 px-4 py-2 rounded-full bg-secondary-container text-on-secondary-container border border-secondary/10 transition-all active:scale-95">
<span class="material-symbols-outlined text-[18px]">restaurant</span>
<span class="font-label-md">Dining</span>
</button>
<button class="flex items-center gap-2 px-4 py-2 rounded-full bg-white border border-outline-variant text-on-surface-variant hover:bg-surface-container transition-all active:scale-95">
<span class="material-symbols-outlined text-[18px]">shopping_bag</span>
<span class="font-label-md">Supplies</span>
</button>
<button class="flex items-center gap-2 px-4 py-2 rounded-full bg-white border border-outline-variant text-on-surface-variant hover:bg-surface-container transition-all active:scale-95">
<span class="material-symbols-outlined text-[18px]">commute</span>
<span class="font-label-md">Travel</span>
</button>
<button class="flex items-center gap-2 px-4 py-2 rounded-full bg-white border border-outline-variant text-on-surface-variant hover:bg-surface-container transition-all active:scale-95">
<span class="material-symbols-outlined text-[18px]">add</span>
<span class="font-label-md">Other</span>
</button>
</div>
</section>
<!-- Line Items Section -->
<section class="bg-surface-container-lowest border border-outline-variant rounded-xl shadow-[0_4px_20px_rgba(15,23,42,0.05)] overflow-hidden">
<div class="px-md py-sm bg-surface-container-low border-b border-outline-variant flex justify-between items-center">
<h3 class="font-label-md text-on-surface-variant uppercase tracking-wider">Line Items</h3>
<span class="text-[12px] font-label-md text-secondary">3 items found</span>
</div>
<div class="divide-y divide-outline-variant">
<!-- Item 1 -->
<div class="p-md flex items-center gap-md group">
<div class="flex-grow space-y-1">
<label class="text-[12px] font-label-md text-on-primary-container block">Item Name</label>
<input class="w-full bg-transparent border-none p-0 font-body-md focus:ring-0 text-on-surface" type="text" value="Premium Coffee Roast"/>
</div>
<div class="w-24 text-right space-y-1">
<label class="text-[12px] font-label-md text-on-primary-container block">Price</label>
<div class="flex items-center justify-end font-data-mono text-on-surface">
<span>$</span>
<input class="w-16 bg-transparent border-none p-0 text-right focus:ring-0 font-data-mono" type="text" value="18.50"/>
</div>
</div>
</div>
<!-- Item 2 -->
<div class="p-md flex items-center gap-md group">
<div class="flex-grow space-y-1">
<label class="text-[12px] font-label-md text-on-primary-container block">Item Name</label>
<input class="w-full bg-transparent border-none p-0 font-body-md focus:ring-0 text-on-surface" type="text" value="Artisan Pastry Box"/>
</div>
<div class="w-24 text-right space-y-1">
<label class="text-[12px] font-label-md text-on-primary-container block">Price</label>
<div class="flex items-center justify-end font-data-mono text-on-surface">
<span>$</span>
<input class="w-16 bg-transparent border-none p-0 text-right focus:ring-0 font-data-mono" type="text" value="12.00"/>
</div>
</div>
</div>
<!-- Item 3 -->
<div class="p-md flex items-center gap-md group">
<div class="flex-grow space-y-1">
<label class="text-[12px] font-label-md text-on-primary-container block">Item Name</label>
<input class="w-full bg-transparent border-none p-0 font-body-md focus:ring-0 text-on-surface italic" type="text" value="Service Charge (10%)"/>
</div>
<div class="w-24 text-right space-y-1">
<label class="text-[12px] font-label-md text-on-primary-container block">Price</label>
<div class="flex items-center justify-end font-data-mono text-on-surface">
<span>$</span>
<input class="w-16 bg-transparent border-none p-0 text-right focus:ring-0 font-data-mono" type="text" value="3.05"/>
</div>
</div>
</div>
</div>
<!-- Total Section -->
<div class="bg-primary-container p-lg text-white">
<div class="flex justify-between items-center">
<span class="font-headline-md opacity-80">Total Amount</span>
<div class="text-right">
<span class="font-display-lg block">$33.55</span>
<span class="text-[12px] font-label-md text-on-primary-container">Tax included</span>
</div>
</div>
</div>
</section>
<!-- Notes / Memo -->
<section class="space-y-sm">
<label class="font-label-md text-on-surface-variant block">Memo (Optional)</label>
<div class="bg-white border border-outline-variant rounded-lg p-md">
<textarea class="w-full bg-transparent border-none p-0 focus:ring-0 font-body-md text-on-surface h-16 resize-none" placeholder="Add details about this expense..."></textarea>
</div>
</section>
</main>
<!-- Bottom Actions Layer -->
<div class="fixed bottom-0 left-0 w-full bg-white/80 backdrop-blur-lg border-t border-slate-200 px-margin py-lg z-40">
<div class="max-w-xl mx-auto flex gap-md">
<button class="flex-1 py-4 border border-outline text-on-surface font-headline-md text-base rounded-xl transition-all active:scale-[0.98] hover:bg-surface-container">
                Retake
            </button>
<button class="flex-[2] py-4 bg-primary text-on-primary font-headline-md text-base rounded-xl shadow-lg transition-all active:scale-[0.98] hover:bg-slate-900">
                Save Expense
            </button>
</div>
</div>
<!-- Hidden Navigation Shell as per Shared Components JSON rules (Suppressed for focused task-flow but technically provided) -->
<!-- Note: Following "Linear/Transactional" rule to suppress main nav in Review screen -->
<!-- Material Symbols initialization script is not needed as we use the standard tag -->
</body></html>
