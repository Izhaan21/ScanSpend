<body class="bg-surface text-on-surface antialiased min-h-screen flex flex-col md:flex-row">

<span class="material-symbols-outlined text-[32px]">qr_code_scanner</span>
<span class="font-headline-lg text-headline-lg tracking-tight">ScanSpend</span>
</div>
<h2 class="font-display-lg text-display-lg text-on-primary mb-6">Digital Assurance at scale.</h2>
<p class="font-body-lg text-body-lg text-primary-fixed-dim">Join thousands of professionals securing their financial data with unmatched speed and accuracy.</p>
</div>
</div>
<!-- Right Form Area -->
<div class="flex-1 flex flex-col justify-center px-6 sm:px-12 md:px-16 lg:px-24 xl:px-32 py-12 md:py-0 bg-surface">
<!-- Mobile Logo (Hidden on Desktop) -->
<div class="md:hidden flex items-center gap-2 mb-12 text-primary-container">
<span class="material-symbols-outlined text-[28px]">qr_code_scanner</span>
<span class="font-headline-lg text-headline-lg tracking-tight">ScanSpend</span>
</div>
<div class="w-full max-w-md mx-auto md:mx-0">
<!-- Header -->
<div class="mb-10">
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-2">Create Account</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Enter your details to get started.</p>
</div>
<!-- Form -->
<form class="space-y-6">
<!-- Full Name Field -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-1.5" for="fullName">Full Name</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]">person</span>
</span>
<input class="w-full h-12 pl-10 pr-4 bg-surface-container-lowest border border-outline-variant rounded focus:border-primary-container focus:ring-1 focus:ring-primary-container outline-none transition-colors font-body-md text-body-md text-on-surface shadow-[0_4px_20px_rgba(15,23,42,0.02)]" id="fullName" name="fullName" placeholder="Jane Doe" type="text"/>
</div>
</div>
<!-- Email Field -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-1.5" for="email">Email</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]">mail</span>
</span>
<input class="w-full h-12 pl-10 pr-4 bg-surface-container-lowest border border-outline-variant rounded focus:border-primary-container focus:ring-1 focus:ring-primary-container outline-none transition-colors font-body-md text-body-md text-on-surface shadow-[0_4px_20px_rgba(15,23,42,0.02)]" id="email" name="email" placeholder="jane@company.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-1.5" for="password">Password</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]">lock</span>
</span>
<input class="w-full h-12 pl-10 pr-10 bg-surface-container-lowest border border-outline-variant rounded focus:border-primary-container focus:ring-1 focus:ring-primary-container outline-none transition-colors font-body-md text-body-md text-on-surface shadow-[0_4px_20px_rgba(15,23,42,0.02)]" id="password" name="password" placeholder="••••••••" type="password"/>
<button class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-outline hover:text-on-surface-variant transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
</div>
<!-- Terms Checkbox -->
<div class="flex items-start pt-2">
<div class="flex items-center h-5">
<input class="w-5 h-5 bg-surface-container-lowest border-outline-variant rounded text-secondary focus:ring-secondary focus:ring-2 focus:ring-offset-2 focus:ring-offset-surface" id="terms" name="terms" type="checkbox"/>
</div>
<div class="ml-3 text-sm">
<label class="font-body-md text-body-md text-on-surface-variant" for="terms">
                            I agree to the <a class="text-secondary hover:text-secondary-container underline decoration-secondary/30 underline-offset-2" href="#">Terms</a> &amp; <a class="text-secondary hover:text-secondary-container underline decoration-secondary/30 underline-offset-2" href="#">Privacy Policy</a>
</label>
</div>
</div>
<!-- Submit Button -->
<button class="w-full h-12 mt-4 bg-secondary text-on-secondary rounded font-label-md text-label-md flex items-center justify-center gap-2 hover:bg-[#005a52] transition-all hover:scale-[0.98] active:scale-[0.96] shadow-[0_4px_20px_rgba(15,23,42,0.1)]" type="button">
                    Create Account
                    <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="relative my-8">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant/50"></div>
</div>
<div class="relative flex justify-center text-sm">
<span class="px-4 bg-surface font-body-md text-body-md text-outline">Or sign up with</span>
</div>
</div>
<!-- Social Sign Up -->
<button class="w-full h-12 bg-surface-container-lowest border border-outline-variant text-on-surface rounded font-label-md text-label-md flex items-center justify-center gap-3 hover:bg-surface-container-low transition-all hover:scale-[0.98] active:scale-[0.96] shadow-[0_4px_20px_rgba(15,23,42,0.02)]" type="button">
<svg class="w-5 h-5" fill="none" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                Google
            </button>
<!-- Footer Link -->
<p class="mt-10 text-center font-body-md text-body-md text-on-surface-variant">
                Already have an account? 
                <a class="font-label-md text-label-md text-primary-container hover:text-secondary transition-colors ml-1" href="#">Login</a>
</p>
</div>
</div>
